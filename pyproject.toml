[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "metatrader-ai-assistant"
version = "0.3.0"
description = "M15-first MT5 assistant with explainable signals, TipRanks context, and guarded execution modes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "feedparser>=6.0.11,<7",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/meta_trader_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
